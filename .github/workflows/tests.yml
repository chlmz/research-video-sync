name: Python tests

on:
  # Branch push covers the stacked preproduction PR without duplicate PR runs.
  push:
    branches: [codex/gpis-preproduction-integration]
  pull_request:
    branches: [main, feature/gpis-recursive-discovery]
  workflow_dispatch:

concurrency:
  group: synthetic-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Select functional Git Bash on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitRoot = Split-Path (Split-Path (Get-Command git).Source -Parent) -Parent
          $bashDir = Join-Path $gitRoot 'bin'
          $bashExe = Join-Path $bashDir 'bash.exe'
          if (-not (Test-Path $bashExe)) { throw 'Git Bash executable missing' }
          & $bashExe -c 'echo BASH_READY'
          if ($LASTEXITCODE -ne 0) { throw 'Git Bash is not functional' }
          $bashDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify Python and media tools
        run: |
          python -c "import sys; assert sys.version_info[:2] == (3, 12); print(sys.version)"
          ffmpeg -version
          ffprobe -version
          bash --version
          ffmpeg -nostdin -v error -f lavfi -i testsrc=size=160x120:rate=10 -f lavfi -i sine=frequency=440 -t 1 -c:v libx264 -pix_fmt yuv420p -c:a aac -f null -
      - name: Run complete suite
        run: python -m pytest -ra --junitxml="${{ runner.temp }}/pytest-results.xml"
      - name: Summarize synthetic test results
        if: always()
        shell: python
        run: |
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path(os.environ['RUNNER_TEMP']) / 'pytest-results.xml'
          if report.exists():
              suites = ET.parse(report).getroot().findall('testsuite')
              counts = {k: sum(int(s.get(k, 0)) for s in suites) for k in ('tests', 'failures', 'errors', 'skipped')}
              summary = ', '.join(f'{k}={v}' for k, v in counts.items())
              Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(summary, encoding='utf-8')
              print(f'::notice title=Pytest counts::{summary}')
              for suite in suites:
                  for case in suite.findall('testcase'):
                      for kind in ('failure', 'error'):
                          item = case.find(kind)
                          if item is not None:
                              text = (case.get('classname', '') + '.' + case.get('name', '') + ': ' + (item.text or ''))[:3000]
                              text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                              print(f'::error title=Synthetic test failure::{text}')
          else:
              print('::warning::JUnit report unavailable; tests may not have started')
      - name: Preserve test counts and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}
          path: ${{ runner.temp }}/pytest-results.xml
          if-no-files-found: warn
