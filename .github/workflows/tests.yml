name: Python tests

on:
  pull_request:
    branches: [main, feature/gpis-recursive-discovery]
  workflow_dispatch:

concurrency:
  group: synthetic-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify Python and media tools
        run: |
          python -c "import sys; assert sys.version_info[:2] == (3, 12); print(sys.version)"
          ffmpeg -version
          ffprobe -version
          ffmpeg -nostdin -v error -f lavfi -i testsrc=size=160x120:rate=10 -f lavfi -i sine=frequency=440 -t 1 -c:v libx264 -pix_fmt yuv420p -c:a aac -f null -
      - name: Run complete suite
        run: python -m pytest -ra --junitxml="${{ runner.temp }}/pytest-results.xml"
      - name: Preserve test counts and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}
          path: ${{ runner.temp }}/pytest-results.xml
          if-no-files-found: warn
